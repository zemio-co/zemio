name: Build and Push Images

# Builds the web and api Docker images in CI and publishes them to the GitHub
# Container Registry. Railway deploys these prebuilt images instead of building
# from the Dockerfile, giving a single reproducible artifact that is promoted
# across environments.
#
# Pull requests into master/canary build both images without pushing, to catch
# Docker/build breakage before merge. Pushes to master (production) / canary
# (staging) publish the built images. Each branch publishes a moving tag named
# after it (e.g. `canary`) plus the immutable per-commit SHA tag; `master`
# additionally publishes `latest`.
#
# web and api version and tag independently (see .changeset/config.json — no
# "fixed" group), so a release tag is app-scoped: `web-vX.Y.Z` or
# `api-vX.Y.Z`. Pushing one only builds/publishes/deploys that app's image,
# not both.
#
# build-web/build-api and deploy-production-web/deploy-production-api are
# split per app (not a matrix) because a job-level `if` can't read the matrix
# context — only step-level `if` can — so filtering "does this tag belong to
# this app" needed literal per-job conditions instead.
#
# A canary push also redeploys the staging Railway services, and an app's
# version tag redeploys that app's production service — see the
# deploy-staging/deploy-production-* jobs below. Railway can't watch GHCR
# itself (its auto-deploy needs a linked GitHub repo, which conflicts with
# building images in CI instead of on Railway), so this is the only thing
# that actually ships a newly built image.

on:
  pull_request:
    branches:
      - master
      - canary
  push:
    branches:
      - master
      - canary
    tags:
      - "web-v*"
      - "api-v*"
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    # On a tag push, only build/publish if the tag belongs to this app;
    # branch pushes and PRs always build.
    if: github.ref_type != 'tag' || startsWith(github.ref_name, 'web-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zemio-web
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=match,pattern=\w+-v(.*),group=1
            # Pinned to master, not {{is_default_branch}}: the production tag must
            # not follow a change to the repo's default branch setting.
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          # Baked into the image rather than configured per environment — see
          # docs/deployment.md, "Build revision". Must be the real commit SHA:
          # AppSignal opens a deploy marker when it changes, and links backtrace
          # frames to the repo at that commit.
          build-args: |
            APP_REVISION=${{ github.sha }}

      # Sourcemaps ride inside the image, so they are pulled back out of the
      # artifact that was actually published rather than rebuilt: Turbopack
      # chunk names are not stable across builds, and maps from a second build
      # would upload cleanly and resolve nothing.
      #
      # By digest, not by tag. `sha-<sha>` is written by every build of a
      # commit, so a branch push and a tag push racing on the same commit each
      # overwrite it — and the loser's maps describe chunk names that exist in
      # no deployed image. The digest names the image this step's own build
      # just pushed and nothing else can move it.
      - name: Extract sourcemaps
        if: github.event_name != 'pull_request' && (github.ref_name == 'canary' || github.ref_name == 'master')
        run: |
          image="ghcr.io/${{ github.repository_owner }}/zemio-web@${{ steps.build.outputs.digest }}"
          docker pull -q "$image"
          container=$(docker create "$image")
          docker cp "$container:/app/sourcemaps" ./sourcemaps
          docker rm -f "$container" > /dev/null
          echo "extracted $(find ./sourcemaps -name '*.map' | wc -l) sourcemaps"

      # On branch pushes, not on version tags, because the branch tags are what
      # the services actually run: staging tracks `canary` and production
      # tracks `master` (see docs/deployment.md, "Railway configuration"). A
      # `web-v*` tag publishes only `sha-…` and the version, so its image is
      # never deployed — maps taken from it would describe a build nobody runs.
      # A `web-v*` tag still triggers the production *deploy*; it just pulls
      # the `master` image whose maps went up when that commit was merged.
      #
      # Uploaded against the origin of the environment the image is headed for:
      # AppSignal matches a map by the full URL of the minified file, so one
      # image serving two domains needs one upload per environment.
      - name: Upload sourcemaps to AppSignal
        if: github.event_name != 'pull_request' && (github.ref_name == 'canary' || github.ref_name == 'master')
        env:
          APPSIGNAL_PUSH_API_KEY: ${{ secrets.APPSIGNAL_PUSH_API_KEY }}
          APPSIGNAL_APP_NAME: zemio-web
          APPSIGNAL_APP_ENV: ${{ github.ref_name == 'canary' && 'staging' || 'production' }}
          ASSET_ORIGIN: ${{ github.ref_name == 'canary' && 'https://staging.zemio.co' || 'https://app.zemio.co' }}
          APP_REVISION: ${{ github.sha }}
        run: node apps/web/scripts/upload-sourcemaps.mjs ./sourcemaps

  build-api:
    if: github.ref_type != 'tag' || startsWith(github.ref_name, 'api-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zemio-api
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=match,pattern=\w+-v(.*),group=1
            # Pinned to master, not {{is_default_branch}}: the production tag must
            # not follow a change to the repo's default branch setting.
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # Neither Railway service has a linked GitHub repo (deliberately — see the
  # "Why CI builds the images" note in docs/deployment.md), so Railway's
  # auto-deploy-on-new-image can't fire on its own: nothing ever tells it a
  # new `canary`/`master`/`vX.Y.Z` image landed in GHCR. These jobs are that
  # missing trigger, using a Railway project token (scoped to exactly one
  # environment) per environment.
  deploy-staging:
    needs: [build-web, build-api]
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service_id:
          - 7f4af184-7675-483a-85a3-e034746d661e # frontend-staging (zemio-web image)
          - e533fc67-9c2d-4064-b918-52f16d105e59 # api-staging (zemio-api image)
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy staging service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: railway redeploy --service ${{ matrix.service_id }} --yes

  deploy-production-web:
    needs: build-web
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'web-v')
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy frontend-prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: railway redeploy --service a982daf5-2f7d-49fe-880d-9972b9c85c4a --yes

  deploy-production-api:
    needs: build-api
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'api-v')
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy api-prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: railway redeploy --service f0d532fa-eb69-4c5c-950f-d3d1fb5b3c1c --yes
